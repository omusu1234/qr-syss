<script>
    let currentLatitude = null;
    let currentLongitude = null;
    
    const lectureLat = {{ session.lecture_hall_latitude }};
    const lectureLng = {{ session.lecture_hall_longitude }};
    const locationRadius = {{ session.location_radius or 100 }};
    
    let watchId = null;
    let bestPosition = null;
    let positionCount = 0;
    let gpsFinalized = false;
    
    function updateCoordinates(lng, lat) {
        currentLongitude = parseFloat(lng.toFixed(6));
        currentLatitude = parseFloat(lat.toFixed(6));
    }
    
    function finalizeGPS(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy;
    
        updateCoordinates(lng, lat);
        gpsFinalized = true;
    
        const statusDiv = document.getElementById('locationStatus');
        const submitBtn = document.getElementById('submitBtn');
    
        const distance = calculateDistance(lectureLat, lectureLng, lat, lng);
    
        if (distance <= locationRadius) {
            statusDiv.className = 'alert alert-success';
            statusDiv.innerHTML = `
                <span class="status-indicator status-success"></span>
                <strong>Location Verified!</strong> You are within range (${distance.toFixed(0)}m away).
            `;
            submitBtn.disabled = false;
        } else {
            statusDiv.className = 'alert alert-danger';
            statusDiv.innerHTML = `
                <span class="status-indicator status-error"></span>
                <strong>Too Far!</strong> You are ${distance.toFixed(0)}m away (Max: ${locationRadius}m). Move closer.
            `;
            submitBtn.disabled = true;
        }
    
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    }
    
    function getCurrentLocation() {
        const statusDiv = document.getElementById('locationStatus');
        const submitBtn = document.getElementById('submitBtn');
    
        gpsFinalized = false;
        bestPosition = null;
        positionCount = 0;
    
        statusDiv.className = 'alert alert-info';
        statusDiv.innerHTML = '<span class="status-indicator status-warning"></span> Getting GPS location...';
    
        if (!navigator.geolocation) {
            statusDiv.className = 'alert alert-warning';
            statusDiv.textContent = 'Geolocation not supported on your device.';
            submitBtn.disabled = true;
            return;
        }
    
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    
        watchId = navigator.geolocation.watchPosition(
            (position) => {
                if (gpsFinalized) return;
    
                positionCount++;
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;
    
                if (!bestPosition || accuracy < bestPosition.coords.accuracy) {
                    bestPosition = position;
                }
    
                updateCoordinates(lng, lat);
    
                statusDiv.innerHTML = `<span class="status-indicator status-warning"></span>
                    Reading ${positionCount}... Accuracy: ±${Math.round(accuracy)}m`;
    
                if (accuracy < 70) finalizeGPS(position);
            },
            (error) => {
                gpsFinalized = true;
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    
                statusDiv.className = "alert alert-danger";
                let msg = "GPS error: " + error.message;
                statusDiv.innerHTML = `<strong>Error:</strong> ${msg}`;
                submitBtn.disabled = true;
            },
            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 30000
            }
        );
    
        // Fallback after 30s
        setTimeout(() => {
            if (gpsFinalized) return;
            gpsFinalized = true;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (bestPosition) finalizeGPS(bestPosition);
            else {
                statusDiv.className = 'alert alert-warning';
                statusDiv.innerHTML = 'Unable to get accurate GPS. Move closer or retry.';
                submitBtn.disabled = true;
            }
        }, 30000);
    }
    
    // Haversine formula remains the same
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const rad = Math.PI / 180;
        const dLat = (lat2 - lat1) * rad;
        const dLon = (lon2 - lon1) * rad;
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                  Math.sin(dLon / 2) ** 2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }
    
    // Start GPS on page load
    document.addEventListener('DOMContentLoaded', () => {
        getCurrentLocation();
    });
    
    // Form Submission (existing logic)
    document.getElementById('attendanceForm').addEventListener('submit', async function (e) {
        e.preventDefault();
    
        if (!currentLatitude || !currentLongitude) {
            alert('Location not verified yet.');
            return;
        }
    
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Submitting...';
    
        const formData = {
            token: '{{ token }}',
            admission_no: document.getElementById('admission_no').value,
            student_name: document.getElementById('student_name').value,
            latitude: currentLatitude,
            longitude: currentLongitude
        };
    
        try {
            const response = await fetch('/api/submit-attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
    
            const data = await response.json();
            const resultDiv = document.getElementById('resultMessage');
            resultDiv.style.display = 'block';
    
            if (data.success) {
                resultDiv.className = 'alert alert-success';
                resultDiv.innerHTML = `<h5><i class="bi bi-check-circle"></i> Success!</h5><p>${data.message}</p>`;
                document.getElementById('attendanceForm').style.display = 'none';
            } else {
                resultDiv.className = 'alert alert-danger';
                resultDiv.innerHTML = `<h5><i class="bi bi-x-circle"></i> Error</h5><p>${data.message}</p>`;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check-circle"></i> Submit Attendance';
            }
        } catch (error) {
            console.error(error);
            alert('Network error. Please try again.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check-circle"></i> Submit Attendance';
        }
    });
    
    // Countdown Timer (existing logic)
    {% if not is_expired and expires_timestamp %}
    (function () {
        const expiresAt = {{ expires_timestamp }};
        const countdownElement = document.getElementById('countdown');
    
        setInterval(() => {
            const now = Date.now();
            const remaining = expiresAt - now;
    
            if (remaining <= 0) {
                countdownElement.innerHTML = '<span class="text-danger">Expired</span>';
                document.getElementById('submitBtn').disabled = true;
                return;
            }
    
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            countdownElement.innerHTML = `Expires in <strong>${minutes}m ${seconds}s</strong>`;
        }, 1000);
    })();
    {% endif %}
    </script>
