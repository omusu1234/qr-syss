{% extends "base.html" %}

{% block title %}Create QR Session{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-qr-code"></i> Create New QR Session</h2>

<form method="POST" action="{{ url_for('create_session') }}">
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="unit_id" class="form-label">Select Unit/Course</label>
                <select class="form-select" id="unit_id" name="unit_id" required>
                    <option value="">Choose a unit...</option>
                    {% for unit in units %}
                    <option value="{{ unit.id }}">{{ unit.unit_code }} - {{ unit.unit_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="session_name" class="form-label">Session Name</label>
                <input type="text" class="form-control" id="session_name" name="session_name"
                    placeholder="e.g., Lecture 1 - Introduction" required>
            </div>

            <div class="mb-3">
                <label for="hall_name" class="form-label">Hall Name (Optional)</label>
                <input type="text" class="form-control" id="hall_name" name="hall_name"
                    placeholder="e.g., Main Hall, Room 101">
            </div>

            <div class="mb-3">
                <label for="location_radius" class="form-label">Location Radius (meters)</label>
                <input type="number" class="form-control" id="location_radius" name="location_radius" min="1" step="1"
                    value="100" required>
                <small class="text-muted">Maximum distance in meters from the hall location</small>
            </div>

            <div class="mb-3">
                <label for="qr_expiry_minutes" class="form-label">QR Code Expiry (minutes)</label>
                <input type="number" class="form-control" id="qr_expiry_minutes" name="qr_expiry_minutes" min="1"
                    max="1440" step="1" value="120" required>
                <div class="mt-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="setQuickDuration(30)">30m</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="setQuickDuration(60)">1h</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="setQuickDuration(120)">2h</button>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Lecture Hall Location (GPS Coordinates)</label>
                <div id="locationStatus" class="alert alert-info d-none" role="alert"></div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label for="latitude" class="form-label">Latitude</label>
                        <input type="number" step="any" class="form-control" id="latitude"
                            name="latitude" required placeholder="">
                    </div>
                    <div class="col-6">
                        <label for="longitude" class="form-label">Longitude</label>
                        <input type="number" step="any" class="form-control" id="longitude"
                            name="longitude" required placeholder="">
                    </div>
                </div>

                <div class="text-center">
                    <button type="button" class="btn btn-primary" onclick="getCurrentLocation()" id="locationBtn">
                        <i class="bi bi-geo-alt"></i> Use My Current Location (GPS)
                    </button>
                    <button type="button" class="btn btn-outline-secondary ms-2" onclick="improveLocationAccuracy()" id="improveBtn" style="display: none;">
                        <i class="bi bi-arrow-clockwise"></i> Retry GPS
                    </button>
                </div>
                <div class="mt-2">
                    <small class="text-muted" id="accuracyInfo"></small>
                </div>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <label for="session_start_time" class="form-label">Session Start Time (Optional)</label>
        <input type="datetime-local" class="form-control" id="session_start_time" name="session_start_time">
    </div>

    <div class="mb-3">
        <label for="late_threshold_minutes" class="form-label">Late Arrival Threshold (minutes)</label>
        <input type="number" class="form-control" id="late_threshold_minutes" name="late_threshold_minutes" min="0"
            step="1" value="15">
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="bi bi-qr-code-scan"></i> Generate QR Code
    </button>
    <a href="{{ url_for('lecturer_dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>

<script>
// Return values EXACTLY how you wrote them (lng, lat)
function updateCoordinates(lng, lat) {
    document.getElementById('longitude').value = lng.toFixed(6);
    document.getElementById('latitude').value = lat.toFixed(6);
}

let watchId = null;
let positionReadings = []; // Array to store all readings
let positionCount = 0;
let gpsFinalized = false;
let startTime = null;
let lastAccuracyImprovement = null;
let stabilityCheckInterval = null;

// Advanced statistical filtering functions for lecturers
function calculateMedian(values) {
    const sorted = [...values].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function calculateWeightedAverage(positions) {
    let totalWeight = 0;
    let weightedLat = 0;
    let weightedLng = 0;
    
    positions.forEach(pos => {
        const weight = 1 / Math.pow(pos.coords.accuracy || 1, 2); // Square of inverse accuracy for better weighting
        weightedLat += pos.coords.latitude * weight;
        weightedLng += pos.coords.longitude * weight;
        totalWeight += weight;
    });
    
    return {
        lat: weightedLat / totalWeight,
        lng: weightedLng / totalWeight,
        avgAccuracy: positions.reduce((sum, p) => sum + p.coords.accuracy, 0) / positions.length,
        minAccuracy: Math.min(...positions.map(p => p.coords.accuracy)),
        maxAccuracy: Math.max(...positions.map(p => p.coords.accuracy))
    };
}

function filterOutliers(positions) {
    if (positions.length < 10) return positions;
    
    // Calculate median position
    const lats = positions.map(p => p.coords.latitude);
    const lngs = positions.map(p => p.coords.longitude);
    const medianLat = calculateMedian(lats);
    const medianLng = calculateMedian(lngs);
    
    // Calculate distances from median
    const distances = positions.map(pos => {
        const R = 6371000; // Earth radius in meters
        const dLat = (pos.coords.latitude - medianLat) * Math.PI / 180;
        const dLng = (pos.coords.longitude - medianLng) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(medianLat * Math.PI / 180) * Math.cos(pos.coords.latitude * Math.PI / 180) *
                  Math.sin(dLng / 2) ** 2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    });
    
    const medianDistance = calculateMedian(distances);
    const threshold = medianDistance * 1.5; // Stricter threshold for lecturers (1.5x instead of 2x)
    
    // Filter out outliers
    return positions.filter((pos, idx) => distances[idx] <= threshold);
}

function processReadings() {
    if (positionReadings.length < 15) return null;
    
    // Filter out network-based readings (accuracy > 100m)
    let validReadings = positionReadings.filter(p => p.coords.accuracy <= 100);
    
    if (validReadings.length < 10) return null;
    
    // Filter out outliers (more aggressive for lecturers)
    validReadings = filterOutliers(validReadings);
    
    // Sort by accuracy (best first)
    validReadings.sort((a, b) => a.coords.accuracy - b.coords.accuracy);
    
    // Take best 30 readings (or all if less than 30) for lecturers
    const bestReadings = validReadings.slice(0, Math.min(30, validReadings.length));
    
    // Calculate weighted average
    return calculateWeightedAverage(bestReadings);
}

function getCurrentLocation() {
    const statusDiv = document.getElementById('locationStatus');
    const locationBtn = document.getElementById('locationBtn');
    const improveBtn = document.getElementById('improveBtn');
    const accuracyInfo = document.getElementById('accuracyInfo');

    statusDiv.classList.remove('d-none');
    statusDiv.className = 'alert alert-info';
    statusDiv.innerHTML = '<strong>Getting GPS location...</strong><br><small>Please wait 90-120 seconds for super accurate GPS. This is critical for setting the lecture hall location accurately.<br><strong>Tips for best accuracy:</strong><br>• Stand at the center of the lecture hall<br>• Move closer to a window or go outside if possible<br>• Hold device steady<br>• Ensure location services are set to "High Accuracy" mode<br>• Network-based location will be automatically rejected</small>';
    accuracyInfo.textContent = '';

    gpsFinalized = false;
    locationBtn.disabled = true;
    improveBtn.style.display = 'none';

    positionReadings = [];
    positionCount = 0;
    startTime = Date.now();
    lastAccuracyImprovement = Date.now();

    // Auto-show retry after 20s
    setTimeout(() => {
        if (!gpsFinalized) improveBtn.style.display = 'inline-block';
    }, 20000);

    if (!navigator.geolocation) {
        statusDiv.className = 'alert alert-warning';
        statusDiv.textContent = 'Geolocation not supported on your device.';
        locationBtn.disabled = false;
        return;
    }

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }
    
    if (stabilityCheckInterval !== null) {
        clearInterval(stabilityCheckInterval);
    }

    // Advanced stability check for lecturers
    stabilityCheckInterval = setInterval(() => {
        if (gpsFinalized || positionReadings.length < 10) return;
        
        const recent = positionReadings.slice(-10);
        const avgAccuracy = recent.reduce((sum, p) => sum + p.coords.accuracy, 0) / recent.length;
        const bestAccuracy = Math.min(...recent.map(p => p.coords.accuracy));
        
        // Check if accuracy has improved in last 15 seconds
        const timeSinceImprovement = (Date.now() - lastAccuracyImprovement) / 1000;
        
        // For lecturers, require more readings and better accuracy
        if (avgAccuracy < 20 && timeSinceImprovement > 15 && positionReadings.length >= 30) {
            // Accuracy is excellent and stable - can finalize
            const processed = processReadings();
            if (processed) {
                updateCoordinates(processed.lng, processed.lat);
                finalizeGPS(processed, statusDiv, locationBtn, improveBtn, accuracyInfo);
            }
        }
    }, 5000); // Check every 5 seconds

    watchId = navigator.geolocation.watchPosition(
        (position) => {
            if (gpsFinalized) return;

            positionCount++;
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const altitude = position.coords.altitude;
            const altitudeAccuracy = position.coords.altitudeAccuracy;

            // Reject network-based locations immediately
            if (accuracy > 100) {
                statusDiv.innerHTML = `<strong>Poor accuracy detected (${Math.round(accuracy)}m)</strong><br>
                    <small>This appears to be network-based location. Waiting for GPS signal...<br>
                    Valid GPS readings collected: ${positionReadings.length}</small>`;
                return;
            }

            // Store reading
            positionReadings.push({
                coords: {
                    latitude: lat,
                    longitude: lng,
                    accuracy: accuracy,
                    altitude: altitude,
                    altitudeAccuracy: altitudeAccuracy
                },
                timestamp: Date.now()
            });

            // Track accuracy improvement
            if (positionReadings.length > 1) {
                const prevBest = Math.min(...positionReadings.slice(0, -1).map(p => p.coords.accuracy));
                if (accuracy < prevBest) {
                    lastAccuracyImprovement = Date.now();
                }
            }

            // Update display
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const bestAccuracy = Math.min(...positionReadings.map(p => p.coords.accuracy));
            const avgAccuracy = positionReadings.reduce((sum, p) => sum + p.coords.accuracy, 0) / positionReadings.length;
            
            let label = "excellent";
            if (bestAccuracy < 10) label = "excellent";
            else if (bestAccuracy < 20) label = "very good";
            else if (bestAccuracy < 50) label = "good";
            else if (bestAccuracy < 100) label = "usable";
            else label = "weak";

            // Show processed coordinates if we have enough readings
            let displayLat = lat;
            let displayLng = lng;
            const processed = processReadings();
            if (processed && positionReadings.length >= 20) {
                displayLat = processed.lat;
                displayLng = processed.lng;
                updateCoordinates(processed.lng, processed.lat);
            } else {
                updateCoordinates(lng, lat);
            }

            statusDiv.innerHTML = `<strong>GPS Reading ${positionCount}</strong><br>
                <small>Current: ±${Math.round(accuracy)}m | Best: ±${Math.round(bestAccuracy)}m | Avg: ±${Math.round(avgAccuracy)}m (${label})<br>
                Valid readings: ${positionReadings.length} | Time: ${elapsed}s<br>
                ${positionReadings.length < 30 ? `Collecting more readings for maximum accuracy... (target: 30-50 readings)` : 'Processing readings for optimal accuracy...'}</small>`;

            accuracyInfo.textContent = `Best accuracy: ±${Math.round(bestAccuracy)}m (${label}) | Readings: ${positionReadings.length} | ${processed ? 'Averaged' : 'Single'}`;
        },
        (error) => {
            gpsFinalized = true;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (stabilityCheckInterval !== null) clearInterval(stabilityCheckInterval);

            let msg = "GPS error: ";
            if (error.code === error.PERMISSION_DENIED) msg = "Location permission denied. Please enable location access.";
            if (error.code === error.POSITION_UNAVAILABLE) msg = "Location unavailable. Please ensure GPS is enabled.";
            if (error.code === error.TIMEOUT) msg = "GPS timed out. Please try again.";

            statusDiv.className = "alert alert-danger";
            statusDiv.textContent = msg;

            locationBtn.disabled = false;
            improveBtn.style.display = 'inline-block';
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 120000  // 120 seconds for lecturers
        }
    );

    // Finalize after 120 seconds or when we have enough good readings
    setTimeout(() => {
        if (gpsFinalized) return;

        gpsFinalized = true;

        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        
        if (stabilityCheckInterval !== null) {
            clearInterval(stabilityCheckInterval);
        }

        if (positionReadings.length === 0) {
            statusDiv.className = "alert alert-warning";
            statusDiv.textContent = "Unable to get GPS readings. Please check permissions and try again.";
            locationBtn.disabled = false;
            return;
        }

        // Process readings for best result
        const processed = processReadings();
        
        if (processed && processed.avgAccuracy <= 30) {
            // Excellent - use processed coordinates
            updateCoordinates(processed.lng, processed.lat);
            finalizeGPS(processed, statusDiv, locationBtn, improveBtn, accuracyInfo);
        } else {
            // Find best single reading
            const bestReading = positionReadings.reduce((best, current) => 
                current.coords.accuracy < best.coords.accuracy ? current : best
            );
            
            if (bestReading.coords.accuracy <= 50) {
                updateCoordinates(bestReading.coords.longitude, bestReading.coords.latitude);
                finalizeGPS({coords: bestReading.coords, avgAccuracy: bestReading.coords.accuracy}, statusDiv, locationBtn, improveBtn, accuracyInfo);
            } else if (bestReading.coords.accuracy <= 100 && positionReadings.length >= 20) {
                // Acceptable with enough readings
                statusDiv.className = 'alert alert-warning';
                statusDiv.innerHTML = `<strong>GPS accuracy is moderate (${Math.round(bestReading.coords.accuracy)}m)</strong><br>
                    <small>For better accuracy, move to an area with better GPS signal. You can still use this location.</small>`;
                updateCoordinates(bestReading.coords.longitude, bestReading.coords.latitude);
                finalizeGPS({coords: bestReading.coords, avgAccuracy: bestReading.coords.accuracy}, statusDiv, locationBtn, improveBtn, accuracyInfo);
            } else {
                statusDiv.className = "alert alert-warning";
                statusDiv.innerHTML = `<strong>GPS signal too weak (${Math.round(bestReading.coords.accuracy)}m)</strong><br>
                    <small>Please move to an area with better GPS signal or try again.</small>`;
                locationBtn.disabled = false;
            }
        }
    }, 120000); // 120 seconds for lecturers
}

function finalizeGPS(positionData, statusDiv, locationBtn, improveBtn, accuracyInfo) {
    const accuracy = positionData.avgAccuracy || positionData.coords.accuracy;
    const lat = positionData.lat || positionData.coords.latitude;
    const lng = positionData.lng || positionData.coords.longitude;

    gpsFinalized = true;

    let accuracyLabel = "excellent";
    if (accuracy <= 10) accuracyLabel = "excellent";
    else if (accuracy <= 20) accuracyLabel = "very good";
    else if (accuracy <= 50) accuracyLabel = "good";
    else accuracyLabel = "moderate";

    statusDiv.className = 'alert alert-success';
    statusDiv.innerHTML = `<strong>GPS locked! Accuracy: ±${Math.round(accuracy)}m (${accuracyLabel})</strong><br>
        <small>${positionReadings.length} readings processed${positionData.avgAccuracy ? ' and averaged' : ''} for optimal accuracy</small>`;

    accuracyInfo.textContent = `Final accuracy: ±${Math.round(accuracy)} meters (${accuracyLabel}) | ${positionReadings.length} readings`;

    locationBtn.disabled = false;
    improveBtn.style.display = 'none';

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }
    
    if (stabilityCheckInterval !== null) {
        clearInterval(stabilityCheckInterval);
    }
}

function improveLocationAccuracy() {
    getCurrentLocation();
}

function setQuickDuration(minutes) {
    document.getElementById('qr_expiry_minutes').value = minutes;
}

document.addEventListener('DOMContentLoaded', () => {
    // Leave coordinates empty by default
    document.getElementById('longitude').value = '';
    document.getElementById('latitude').value = '';
});
</script>

{% endblock %}
