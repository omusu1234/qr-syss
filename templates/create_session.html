<script>
    // Default to Maseno University coordinates
    const defaultLat = -0.0627;
    const defaultLng = 34.6061;
    
    // DO NOT CHANGE SIGNATURE AS REQUESTED
    function updateCoordinates(lng, lat) {
        document.getElementById('longitude').value = lng.toFixed(6);
        document.getElementById('latitude').value = lat.toFixed(6);
    }
    
    let watchId = null;
    let bestPosition = null;
    let positionCount = 0;
    let gpsFinalized = false;  // Prevents race conditions
    
    function getCurrentLocation() {
        const statusDiv = document.getElementById('locationStatus');
        const locationBtn = document.getElementById('locationBtn');
        const improveBtn = document.getElementById('improveBtn');
        const accuracyInfo = document.getElementById('accuracyInfo');
    
        statusDiv.classList.remove('d-none');
        statusDiv.className = 'alert alert-info';
        statusDiv.textContent = 'Getting GPS location... Please wait for best accuracy.';
        accuracyInfo.classList.remove('text-success');
        accuracyInfo.textContent = '';
    
        locationBtn.disabled = true;
        gpsFinalized = false;
        improveBtn.style.display = 'none';
    
        bestPosition = null;
        positionCount = 0;
    
        // Auto-show retry if GPS is slow
        setTimeout(() => {
            if (!gpsFinalized) improveBtn.style.display = 'inline-block';
        }, 10000);
    
        if (!navigator.geolocation) {
            statusDiv.className = 'alert alert-warning';
            statusDiv.textContent = 'Geolocation not supported on this device.';
            locationBtn.disabled = false;
            return;
        }
    
        // Clear existing watchers
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
    
        watchId = navigator.geolocation.watchPosition(
            (position) => {
                if (gpsFinalized) return;
    
                positionCount++;
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;
    
                // Store best accuracy so far
                if (!bestPosition || accuracy < bestPosition.coords.accuracy) {
                    bestPosition = position;
                }
    
                updateCoordinates(lng, lat);
    
                // Show progress
                statusDiv.textContent = `Reading ${positionCount}... Current accuracy: ±${Math.round(accuracy)}m`;
    
                // Dynamic accuracy tiers  
                let accuracyLabel = '';
                if (accuracy < 50) accuracyLabel = 'excellent';
                else if (accuracy < 150) accuracyLabel = 'usable';
                else accuracyLabel = 'weak';
    
                accuracyInfo.textContent =
                    `Best accuracy: ±${Math.round(bestPosition.coords.accuracy)}m (${accuracyLabel})`;
    
                // Stop if accuracy is really good
                if (accuracy < 70) {
                    finalizeGPS(position, statusDiv, locationBtn, improveBtn, accuracyInfo);
                }
            },
            (error) => {
                gpsFinalized = true;
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    
                let msg = '';
                switch (error.code) {
                    case error.PERMISSION_DENIED:
                        msg = 'Location access denied. Enable location in your browser.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        msg = 'Location unavailable. Check your GPS settings.';
                        break;
                    case error.TIMEOUT:
                        msg = 'Location request timed out.';
                        break;
                    default:
                        msg = 'Location error: ' + error.message;
                        break;
                }
    
                statusDiv.className = 'alert alert-danger';
                statusDiv.textContent = msg;
    
                accuracyInfo.textContent = '';
                locationBtn.disabled = false;
                improveBtn.style.display = 'inline-block';
            },
            {
                enableHighAccuracy: true,
                timeout: 30000,
                maximumAge: 0
            }
        );
    
        // Hard timeout fallback
        setTimeout(() => {
            if (gpsFinalized) return;
    
            gpsFinalized = true;
    
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
    
            if (bestPosition) {
                finalizeGPS(bestPosition, statusDiv, locationBtn, improveBtn, accuracyInfo);
            } else {
                statusDiv.className = 'alert alert-warning';
                statusDiv.textContent = 'Could not achieve accurate GPS.';
                locationBtn.disabled = false;
            }
        }, 30000);
    }
    
    function finalizeGPS(position, statusDiv, locationBtn, improveBtn, accuracyInfo) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy;
    
        updateCoordinates(lng, lat);
    
        statusDiv.className = 'alert alert-success';
        statusDiv.textContent = `GPS locked! Final accuracy: ±${Math.round(accuracy)}m`;
    
        accuracyInfo.textContent = `Final accuracy: ±${Math.round(accuracy)} meters`;
        accuracyInfo.classList.add('text-success');
    
        gpsFinalized = true;
        locationBtn.disabled = false;
        improveBtn.style.display = 'none';
    
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
    }
    
    function improveLocationAccuracy() {
        getCurrentLocation();
    }
    
    function setQuickDuration(minutes) {
        document.getElementById('qr_expiry_minutes').value = minutes;
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        updateCoordinates(defaultLng, defaultLat);
    });
    </script>
