{% extends "base.html" %}

{% block title %}Create QR Session{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-qr-code"></i> Create New QR Session</h2>

<form method="POST" action="{{ url_for('create_session') }}">
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="unit_id" class="form-label">Select Unit/Course</label>
                <select class="form-select" id="unit_id" name="unit_id" required>
                    <option value="">Choose a unit...</option>
                    {% for unit in units %}
                    <option value="{{ unit.id }}">{{ unit.unit_code }} - {{ unit.unit_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="session_name" class="form-label">Session Name</label>
                <input type="text" class="form-control" id="session_name" name="session_name"
                    placeholder="e.g., Lecture 1 - Introduction" required>
            </div>

            <div class="mb-3">
                <label for="hall_name" class="form-label">Hall Name (Optional)</label>
                <input type="text" class="form-control" id="hall_name" name="hall_name"
                    placeholder="e.g., Main Hall, Room 101">
            </div>

            <div class="mb-3">
                <label for="location_radius" class="form-label">Location Radius (meters)</label>
                <input type="number" class="form-control" id="location_radius" name="location_radius" min="1" step="1"
                    value="100" required>
                <small class="text-muted">Maximum distance in meters from the hall location</small>
            </div>

            <div class="mb-3">
                <label for="qr_expiry_minutes" class="form-label">QR Code Expiry (minutes)</label>
                <input type="number" class="form-control" id="qr_expiry_minutes" name="qr_expiry_minutes" min="1"
                    max="1440" step="1" value="120" required>
                <div class="mt-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="setQuickDuration(30)">30m</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="setQuickDuration(60)">1h</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="setQuickDuration(120)">2h</button>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Lecture Hall Location (GPS Coordinates)</label>
                <div id="locationStatus" class="alert alert-info d-none" role="alert"></div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label for="latitude" class="form-label">Latitude</label>
                        <input type="number" step="any" class="form-control" id="latitude"
                            name="latitude" required placeholder="-0.0627">
                    </div>
                    <div class="col-6">
                        <label for="longitude" class="form-label">Longitude</label>
                        <input type="number" step="any" class="form-control" id="longitude"
                            name="longitude" required placeholder="34.6061">
                    </div>
                </div>

                <div class="text-center">
                    <button type="button" class="btn btn-primary" onclick="getCurrentLocation()" id="locationBtn">
                        <i class="bi bi-geo-alt"></i> Use My Current Location (GPS)
                    </button>
                    <button type="button" class="btn btn-outline-secondary ms-2" onclick="improveLocationAccuracy()" id="improveBtn" style="display: none;">
                        <i class="bi bi-arrow-clockwise"></i> Retry GPS
                    </button>
                </div>
                <div class="mt-2">
                    <small class="text-muted" id="accuracyInfo"></small>
                </div>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <label for="session_start_time" class="form-label">Session Start Time (Optional)</label>
        <input type="datetime-local" class="form-control" id="session_start_time" name="session_start_time">
    </div>

    <div class="mb-3">
        <label for="late_threshold_minutes" class="form-label">Late Arrival Threshold (minutes)</label>
        <input type="number" class="form-control" id="late_threshold_minutes" name="late_threshold_minutes" min="0"
            step="1" value="15">
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="bi bi-qr-code-scan"></i> Generate QR Code
    </button>
    <a href="{{ url_for('lecturer_dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>

<script>
// Default to Maseno University
const defaultLat = -0.0627;
const defaultLng = 34.6061;

function updateCoordinates(lng, lat) {
    document.getElementById('longitude').value = lng.toFixed(7);
    document.getElementById('latitude').value = lat.toFixed(7);
}

let watchId = null;
let bestPosition = null;
let samples = [];
let gpsFinalized = false;
let positionCount = 0;

const STRICT_MIN_SAMPLES = 10;
const STRICT_ACCURACY_LIMIT = 50;
const VERY_STRICT_FILTER = 25;

function getCurrentLocation() {
    const statusDiv = document.getElementById('locationStatus');
    const locationBtn = document.getElementById('locationBtn');
    const improveBtn = document.getElementById('improveBtn');
    const accuracyInfo = document.getElementById('accuracyInfo');

    statusDiv.classList.remove('d-none');
    statusDiv.className = "alert alert-info";
    statusDiv.textContent = "Locking precise GPS... Stand still for best accuracy.";
    accuracyInfo.textContent = "";

    gpsFinalized = false;
    samples = [];
    bestPosition = null;
    positionCount = 0;

    locationBtn.disabled = true;
    improveBtn.style.display = 'none';

    setTimeout(() => {
        if (!gpsFinalized) improveBtn.style.display = 'inline-block';
    }, 12000);

    if (!navigator.geolocation) {
        statusDiv.classList.add("alert-warning");
        statusDiv.textContent = "Geolocation not supported.";
        locationBtn.disabled = false;
        return;
    }

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    watchId = navigator.geolocation.watchPosition(
        (pos) => {
            if (gpsFinalized) return;

            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;

            positionCount++;

            // Reject wild inaccurate points
            if (accuracy > 200) return;

            samples.push({ lat, lng, accuracy });

            // Track best accuracy
            if (!bestPosition || accuracy < bestPosition.coords.accuracy) {
                bestPosition = pos;
            }

            updateCoordinates(lng, lat);

            statusDiv.textContent = `Reading ${positionCount}... Current accuracy: ±${Math.round(accuracy)}m`;

            let average = calcWeightedAverage(samples);

            accuracyInfo.textContent =
                `Best: ±${Math.round(bestPosition.coords.accuracy)}m | Smoothed: ±${Math.round(average.accuracy)}m`;

            // Strict: at least 10 readings AND accuracy < 50m consistency
            if (
                samples.length >= STRICT_MIN_SAMPLES &&
                average.accuracy < STRICT_ACCURACY_LIMIT &&
                bestPosition.coords.accuracy < STRICT_ACCURACY_LIMIT
            ) {
                finalizeGPS(average, statusDiv, locationBtn, improveBtn);
            }
        },
        (err) => {
            gpsFinalized = true;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);

            statusDiv.className = "alert alert-danger";
            statusDiv.textContent = "GPS error. Move outside or try again.";

            locationBtn.disabled = false;
            improveBtn.style.display = 'inline-block';
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
        }
    );

    setTimeout(() => {
        if (gpsFinalized) return;

        if (samples.length >= 5) {
            const avg = calcWeightedAverage(samples);
            finalizeGPS(avg, statusDiv, locationBtn, improveBtn);
        } else {
            statusDiv.className = "alert alert-warning";
            statusDiv.textContent = "Unable to achieve strict accuracy. Try again.";
        }

        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    }, 35000);
}

// Weighted averaging for ultra precision
function calcWeightedAverage(list) {
    let sumLat = 0, sumLng = 0, sumWeight = 0;
    let bestAcc = Infinity;

    for (const p of list) {
        if (p.accuracy < bestAcc) bestAcc = p.accuracy;
    }

    for (const p of list) {
        if (p.accuracy > bestAcc + VERY_STRICT_FILTER) continue;
        let w = 1 / (p.accuracy + 1);
        sumLat += p.lat * w;
        sumLng += p.lng * w;
        sumWeight += w;
    }

    return {
        lat: sumLat / sumWeight,
        lng: sumLng / sumWeight,
        accuracy: bestAcc
    };
}

function finalizeGPS(avg, statusDiv, locationBtn, improveBtn) {
    gpsFinalized = true;

    updateCoordinates(avg.lng, avg.lat);

    statusDiv.className = "alert alert-success";
    statusDiv.textContent = `High-precision GPS locked! Accuracy: ±${Math.round(avg.accuracy)}m`;

    document.getElementById("accuracyInfo").textContent =
        `Final smoothed accuracy: ±${Math.round(avg.accuracy)}m`;

    locationBtn.disabled = false;
    improveBtn.style.display = 'none';

    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
}

function improveLocationAccuracy() {
    getCurrentLocation();
}

function setQuickDuration(minutes) {
    document.getElementById('qr_expiry_minutes').value = minutes;
}

document.addEventListener('DOMContentLoaded', () => {
    updateCoordinates(defaultLng, defaultLat);
});
</script>

{% endblock %}
