{% extends "base.html" %}

{% block title %}Create QR Session{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-qr-code"></i> Create New QR Session</h2>

<!-- Mapbox GL JS -->
<script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
<link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
<!-- Mapbox Geocoder -->
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
<link rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">

<style>
    #map {
        height: 400px;
        width: 100%;
        border-radius: 8px;
        margin-bottom: 15px;
    }

    .mapboxgl-ctrl-geocoder {
        min-width: 100%;
    }
</style>

<form method="POST" action="{{ url_for('create_session') }}">
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="unit_id" class="form-label">Select Unit/Course</label>
                <select class="form-select" id="unit_id" name="unit_id" required>
                    <option value="">Choose a unit...</option>
                    {% for unit in units %}
                    <option value="{{ unit.id }}">{{ unit.unit_code }} - {{ unit.unit_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="session_name" class="form-label">Session Name</label>
                <input type="text" class="form-control" id="session_name" name="session_name"
                    placeholder="e.g., Lecture 1 - Introduction" required>
            </div>

            <div class="mb-3">
                <label for="hall_name" class="form-label">Hall Name (Optional)</label>
                <input type="text" class="form-control" id="hall_name" name="hall_name"
                    placeholder="e.g., Main Hall, Room 101">
            </div>

            <div class="mb-3">
                <label for="location_radius" class="form-label">Location Radius (meters)</label>
                <input type="number" class="form-control" id="location_radius" name="location_radius" min="1" step="1"
                    value="100" required onchange="updateRadiusCircle()">
                <small class="text-muted">Maximum distance in meters from the hall location</small>
            </div>

            <div class="mb-3">
                <label for="qr_expiry_minutes" class="form-label">QR Code Expiry (minutes)</label>
                <input type="number" class="form-control" id="qr_expiry_minutes" name="qr_expiry_minutes" min="1"
                    max="1440" step="1" value="120" required>
                <div class="mt-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="setQuickDuration(30)">30m</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="setQuickDuration(60)">1h</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="setQuickDuration(120)">2h</button>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Lecture Hall Location</label>
                <div id="locationStatus" class="alert alert-info d-none" role="alert"></div>

                <div id="map"></div>

                <div class="row g-2">
                    <div class="col-6">
                        <label for="latitude" class="form-label small">Latitude</label>
                        <input type="number" step="any" class="form-control form-control-sm" id="latitude"
                            name="latitude" required readonly>
                    </div>
                    <div class="col-6">
                        <label for="longitude" class="form-label small">Longitude</label>
                        <input type="number" step="any" class="form-control form-control-sm" id="longitude"
                            name="longitude" required readonly>
                    </div>
                </div>

                <div class="mt-2 text-center">
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="getCurrentLocation()" id="locationBtn">
                        <i class="bi bi-geo-alt"></i> Use My Current Location
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary ms-2" onclick="improveLocationAccuracy()" id="improveBtn" style="display: none;">
                        <i class="bi bi-arrow-clockwise"></i> Improve Accuracy
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-info ms-2" onclick="searchMaseno()" id="masenoBtn">
                        <i class="bi bi-search"></i> Find Maseno University
                    </button>
                </div>
                <div class="mt-2">
                    <small class="text-muted" id="accuracyInfo"></small>
                </div>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <label for="session_start_time" class="form-label">Session Start Time (Optional)</label>
        <input type="datetime-local" class="form-control" id="session_start_time" name="session_start_time">
    </div>

    <div class="mb-3">
        <label for="late_threshold_minutes" class="form-label">Late Arrival Threshold (minutes)</label>
        <input type="number" class="form-control" id="late_threshold_minutes" name="late_threshold_minutes" min="0"
            step="1" value="15">
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="bi bi-qr-code-scan"></i> Generate QR Code
    </button>
    <a href="{{ url_for('lecturer_dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>

<script>
    mapboxgl.accessToken = '{{ mapbox_access_token }}';

    // Default to Maseno University if no location found
    // Maseno University coordinates: -0.0627, 34.6061
    const defaultLat = -0.0627;
    const defaultLng = 34.6061;

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [defaultLng, defaultLat],
        zoom: 13
    });

    // Add navigation controls
    map.addControl(new mapboxgl.NavigationControl());

    // Add geocoder (search)
    const geocoder = new MapboxGeocoder({
        accessToken: mapboxgl.accessToken,
        mapboxgl: mapboxgl,
        marker: false,
        placeholder: 'Search for a place...'
    });
    map.addControl(geocoder);

    // Draggable marker
    const marker = new mapboxgl.Marker({
        draggable: true,
        color: "#3B82F6"
    })
        .setLngLat([defaultLng, defaultLat])
        .addTo(map);

    // Radius circle source and layer
    map.on('load', () => {
        map.addSource('radius-source', {
            type: 'geojson',
            data: getCircleGeoJSON([defaultLng, defaultLat], 100)
        });

        map.addLayer({
            id: 'radius-layer',
            type: 'fill',
            source: 'radius-source',
            paint: {
                'fill-color': '#3B82F6',
                'fill-opacity': 0.2,
                'fill-outline-color': '#2563EB'
            }
        });
    });

    function updateCoordinates(lng, lat) {
        document.getElementById('longitude').value = lng.toFixed(6);
        document.getElementById('latitude').value = lat.toFixed(6);

        // Update radius circle
        const radius = parseInt(document.getElementById('location_radius').value) || 100;
        if (map.getSource('radius-source')) {
            map.getSource('radius-source').setData(getCircleGeoJSON([lng, lat], radius));
        }
    }

    function onDragEnd() {
        const lngLat = marker.getLngLat();
        updateCoordinates(lngLat.lng, lngLat.lat);
    }

    marker.on('dragend', onDragEnd);

    // Update marker when clicking on map
    map.on('click', (e) => {
        const coords = e.lngLat;
        marker.setLngLat(coords);
        updateCoordinates(coords.lng, coords.lat);
        
        // Update status
        const statusDiv = document.getElementById('locationStatus');
        statusDiv.classList.remove('d-none');
        statusDiv.className = 'alert alert-success';
        statusDiv.textContent = `Location set by clicking on map: ${coords.lat.toFixed(6)}, ${coords.lng.toFixed(6)}`;
        
        const accuracyInfo = document.getElementById('accuracyInfo');
        accuracyInfo.textContent = 'Location set manually by clicking on the map';
        accuracyInfo.className = 'text-info';
    });

    // Update marker when searching
    geocoder.on('result', (e) => {
        const coords = e.result.center;
        marker.setLngLat(coords);
        updateCoordinates(coords[0], coords[1]);
        
        // Update status
        const statusDiv = document.getElementById('locationStatus');
        statusDiv.classList.remove('d-none');
        statusDiv.className = 'alert alert-success';
        statusDiv.textContent = `Location found: ${e.result.place_name}`;
        
        const accuracyInfo = document.getElementById('accuracyInfo');
        accuracyInfo.textContent = 'Location set by search';
        accuracyInfo.className = 'text-info';
    });

    // Get current location - GPS only, single reading
    function getCurrentLocation() {
        const statusDiv = document.getElementById('locationStatus');
        const locationBtn = document.getElementById('locationBtn');
        const improveBtn = document.getElementById('improveBtn');
        const accuracyInfo = document.getElementById('accuracyInfo');
        
        statusDiv.classList.remove('d-none');
        statusDiv.className = 'alert alert-info';
        statusDiv.textContent = 'Getting GPS location...';
        locationBtn.disabled = true;
        improveBtn.style.display = 'none';
        accuracyInfo.textContent = '';

        if (!navigator.geolocation) {
            statusDiv.className = 'alert alert-warning';
            statusDiv.textContent = 'Geolocation is not supported by your browser. Please use the search box or drag the marker.';
            locationBtn.disabled = false;
            return;
        }

        // Use getCurrentPosition - single GPS reading, reject network-based locations
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy; // Accuracy in meters
                
                // Validate GPS vs network-based location
                // Network-based locations typically have accuracy > 1000m
                // GPS typically has accuracy < 100m, but can be 100-500m in some conditions
                // Reject if accuracy is very poor (definitely network-based)
                if (accuracy > 1000) {
                    statusDiv.className = 'alert alert-danger';
                    statusDiv.innerHTML = `⚠️ <strong>Network-based location detected (not GPS)</strong><br>
                        Accuracy: ±${Math.round(accuracy)} meters - This is too poor for GPS.<br><br>
                        <strong>This location was rejected.</strong> Please:<br>
                        1. Enable GPS on your device<br>
                        2. Go outside or near a window for better GPS signal<br>
                        3. Click "Use My Current Location" again`;
                    accuracyInfo.textContent = `⚠️ Rejected: Network-based (accuracy: ±${Math.round(accuracy)}m) - Enable GPS and try again`;
                    accuracyInfo.className = 'text-danger';
                    locationBtn.disabled = false;
                    improveBtn.style.display = 'inline-block';
                    return; // Don't update coordinates - reject network-based location
                }

                // Warn if accuracy is borderline (100-1000m) - might be network or poor GPS
                if (accuracy > 100 && accuracy <= 1000) {
                    statusDiv.className = 'alert alert-warning';
                    statusDiv.innerHTML = `⚠️ <strong>Location accuracy is poor</strong><br>
                        Accuracy: ±${Math.round(accuracy)} meters<br>
                        This might be using network location instead of GPS.<br><br>
                        <strong>For better accuracy:</strong> Enable GPS on your device and click "Improve Accuracy"`;
                    accuracyInfo.textContent = `⚠️ Poor accuracy: ±${Math.round(accuracy)} meters - May not be GPS`;
                    accuracyInfo.className = 'text-warning';
                    locationBtn.disabled = false;
                    improveBtn.style.display = 'inline-block';
                    // Still update coordinates but warn user
                } else {
                    // Good GPS accuracy (<= 100m)
                    statusDiv.className = 'alert alert-success';
                    statusDiv.textContent = `GPS location found! Accuracy: ±${Math.round(accuracy)} meters`;
                    accuracyInfo.textContent = `GPS Accuracy: ±${Math.round(accuracy)} meters`;
                    accuracyInfo.className = 'text-success';
                    locationBtn.disabled = false;
                    improveBtn.style.display = 'none';
                }

                // Update map and marker
                map.flyTo({
                    center: [lng, lat],
                    zoom: Math.max(17, Math.min(20, 18 - Math.log10(accuracy))) // Zoom based on accuracy
                });

                marker.setLngLat([lng, lat]);
                updateCoordinates(lng, lat);
            },
            (error) => {
                locationBtn.disabled = false;
                statusDiv.className = 'alert alert-danger';
                
                let errorMsg = 'Error getting location: ';
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        errorMsg = 'Location access denied. Please allow location access in your browser settings and try again.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        errorMsg = 'Location information unavailable. Please check your GPS settings.';
                        break;
                    case error.TIMEOUT:
                        errorMsg = 'Location request timed out. Please try again or use the search box.';
                        break;
                    default:
                        errorMsg += error.message;
                        break;
                }
                statusDiv.textContent = errorMsg;
                accuracyInfo.textContent = '';
            },
            {
                enableHighAccuracy: true,  // Request GPS (browser may still fall back to network)
                timeout: 30000,            // 30 second timeout - give GPS time to lock
                maximumAge: 0              // Don't use cached position - get fresh reading
            }
        );
    }

    // Improve location accuracy by getting a fresh reading
    function improveLocationAccuracy() {
        getCurrentLocation();
    }

    // Search for Maseno University location
    function searchMaseno() {
        const statusDiv = document.getElementById('locationStatus');
        statusDiv.classList.remove('d-none');
        statusDiv.className = 'alert alert-info';
        statusDiv.textContent = 'Searching for Maseno University...';
        
        // Use Mapbox Geocoding API to search for Maseno University
        const query = 'Maseno University, Kenya';
        const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${mapboxgl.accessToken}&limit=1`;
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.features && data.features.length > 0) {
                    const coords = data.features[0].center;
                    const placeName = data.features[0].place_name;
                    
                    map.flyTo({
                        center: coords,
                        zoom: 17
                    });
                    
                    marker.setLngLat(coords);
                    updateCoordinates(coords[0], coords[1]);
                    
                    statusDiv.className = 'alert alert-success';
                    statusDiv.textContent = `Found: ${placeName}`;
                    
                    const accuracyInfo = document.getElementById('accuracyInfo');
                    accuracyInfo.textContent = 'Location set by searching for Maseno University';
                    accuracyInfo.className = 'text-success';
                } else {
                    statusDiv.className = 'alert alert-warning';
                    statusDiv.textContent = 'Could not find Maseno University. Please use the search box above to search manually.';
                }
            })
            .catch(error => {
                statusDiv.className = 'alert alert-danger';
                statusDiv.textContent = 'Error searching for Maseno University. Please use the search box above.';
                console.error('Error:', error);
            });
    }

    // Calculate distance between two coordinates in meters (Haversine formula)
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; // Earth's radius in meters
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // Helper to generate circle GeoJSON
    function getCircleGeoJSON(center, radiusInMeters, points = 64) {
        const coords = {
            latitude: center[1],
            longitude: center[0]
        };

        const km = radiusInMeters / 1000;

        const ret = [];
        const distanceX = km / (111.320 * Math.cos(coords.latitude * Math.PI / 180));
        const distanceY = km / 110.574;

        let theta, x, y;
        for (let i = 0; i < points; i++) {
            theta = (i / points) * (2 * Math.PI);
            x = distanceX * Math.cos(theta);
            y = distanceY * Math.sin(theta);

            ret.push([coords.longitude + x, coords.latitude + y]);
        }
        ret.push(ret[0]);

        return {
            type: 'Feature',
            geometry: {
                type: 'Polygon',
                coordinates: [ret]
            }
        };
    }

    function updateRadiusCircle() {
        const lng = parseFloat(document.getElementById('longitude').value);
        const lat = parseFloat(document.getElementById('latitude').value);
        if (!isNaN(lng) && !isNaN(lat)) {
            const radius = parseInt(document.getElementById('location_radius').value) || 100;
            if (map.getSource('radius-source')) {
                map.getSource('radius-source').setData(getCircleGeoJSON([lng, lat], radius));
            }
        }
    }

    function setQuickDuration(minutes) {
        document.getElementById('qr_expiry_minutes').value = minutes;
    }

    // Initialize coordinates with default values (don't auto-get location)
    document.addEventListener('DOMContentLoaded', () => {
        // Set default coordinates to Maseno University
        updateCoordinates(defaultLng, defaultLat);
    });
</script>
{% endblock %}
